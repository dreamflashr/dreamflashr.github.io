<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREAMFLASHER</title>

  <!-- Запасной готический шрифт с Google Fonts (если local Royal2.ttf не подгрузился) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap">

  <style>
    /* Подключаем шрифт Royal2 */
    @font-face {
      font-family: 'Royal2';
      src: url('Royal2.ttf') format('truetype'),
           url('Royal2.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: monospace, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* ЭКРАН ИНТРО (ЗАСТАВКА) */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s;
    }

    .lyric-line {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 10px 0;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.8s ease;
      color: #aaa;
    }

    .lyric-line.active {
      opacity: 1;
      transform: translateY(0);
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .click-hint {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    /* ФОНОВОЕ ВИДЕО */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.35) contrast(1.2);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.85) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ГОТИЧЕСКИЙ ЗАГОЛОВОК С ОГНЕННОЙ GIF-ТЕКСТУРОЙ */
    .header-title {
      font-family: 'Royal2', 'Pirata One', serif;
      font-size: 5rem;
      text-align: center;
      margin-bottom: 25px;
      user-select: none;
      text-transform: uppercase;
      letter-spacing: 4px;

      /* 1. Наложение текстуры огня (pixel-fire.gif) */
      background-image: url('fire2.gif');
      background-repeat: repeat;
      background-size: 120px auto;
      background-position: center;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      /* 2. Трёхслойное огненное свечение вокруг букв */
      filter: 
        drop-shadow(0 0 8px #ffdc17)
        drop-shadow(0 0 20px #ff9000)
        drop-shadow(0 -10px 35px #ff3600);

      /* 3. Пульсация пламени */
      animation: firePulse 1.8s infinite alternate ease-in-out;
      image-rendering: pixelated;
    }

    /* Анимация изменения интенсивности свечения огня */
    @keyframes firePulse {
      0% {
        filter: 
          drop-shadow(0 0 6px #ffdc17)
          drop-shadow(0 0 15px #ff9000)
          drop-shadow(0 -5px 25px #ff3600);
      }
      100% {
        filter: 
          drop-shadow(0 0 12px #ffee75)
          drop-shadow(0 0 30px #ff7700)
          drop-shadow(0 -15px 45px #dd1100);
      }
    }

    /* ЦЕНТРАЛЬНАЯ КАРТОЧКА */
    .main-card {
      width: 100%;
      max-width: 520px;
      background: rgba(10, 10, 10, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      z-index: 5;
    }

    .audio-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .audio-control:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #fff;
    }

    .audio-control span {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    }

    .links-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links-title {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 5px;
    }

    .link-btn {
      width: 100%;
      display: block;
      text-align: center;
      padding: 12px;
      color: #ccc;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
    }

    .link-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border-style: solid;
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 10px;
      }
      .header-title {
        font-size: 2.8rem;
      }
      .main-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Заставка (Intro) -->
  <div id="intro-screen">
    <p class="lyric-line" id="line1">first line of the song...</p>
    <p class="lyric-line" id="line2">second line comes next...</p>
    <div class="click-hint">[ кликни в любом месте ]</div>
  </div>

  <!-- Фоновое видео -->
  <video class="video-bg" id="bgVideo" autoplay loop muted playsinline webkit-playsinline preload="auto">
    <source src="bg-video.webm" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- Огненный готический заголовок -->
  <h1 class="header-title">DREAMFLASHER</h1>

  <!-- Центральная рабочая область -->
  <main class="main-card">
    
    <div class="audio-control" id="playBtn">
      <span id="playIcon">❚❚</span>
      <span id="playText">DREAMFLASHER — JANE REMOVER</span>
    </div>

    <div class="divider"></div>

    <div class="links-section">
      <div class="links-title">// LINKS & SOCIALS</div>
      
      <a href="https://github.com/dreamflashr/dreamflashr.github.io" target="_blank" class="link-btn">
        [ SOURCE REPOSITORY ]
      </a>
      
      <a href="https://soundcloud.com" target="_blank" class="link-btn">
        [ SOUNDCLOUD ]
      </a>
      
      <a href="https://t.me" target="_blank" class="link-btn">
        [ TELEGRAM ]
      </a>
    </div>

  </main>

  <audio id="bgMusic" loop>
    <source src="dreamflasher.mp3" type="audio/mpeg">
  </audio>

  <script>
    const introScreen = document.getElementById('intro-screen');
    const music = document.getElementById('bgMusic');
    const video = document.getElementById('bgVideo');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');

    setTimeout(() => line1.classList.add('active'), 600);
    setTimeout(() => line2.classList.add('active'), 1800);

    introScreen.addEventListener('click', () => {
      music.play();
      if (video) {
        video.play().catch(() => {});
      }
      introScreen.style.opacity = '0';
      introScreen.style.visibility = 'hidden';
      document.body.style.overflow = 'auto';
    });

    let isPlaying = true;
    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        music.play();
        playIcon.textContent = '❚❚';
        isPlaying = true;
      } else {
        music.pause();
        playIcon.textContent = '▶';
        isPlaying = false;
      }
    });
  </script>
</body>
</html>
