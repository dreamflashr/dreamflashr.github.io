<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREAMFLASHER</title>

  <style>
    /* Подключаем шрифт Royal2 из локального файла */
    @font-face {
      font-family: 'Royal2';
      src: url('Royal2.ttf') format('truetype'),
           url('Royal2.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ЭКРАН ИНТРО (ЗАСТАВКА) */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s;
    }

    .lyric-line {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 10px 0;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.8s ease;
      color: #aaa;
    }

    .lyric-line.active {
      opacity: 1;
      transform: translateY(0);
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .click-hint {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    /* ФОНОВОЕ ВИДЕО И ОВЕРЛЕЙ */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.35) contrast(1.2);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.9) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ГОТИЧЕСКИЙ ЗАГОЛОВОК С ОГНЕМ */
.header-title {
      font-family: 'Royal2', sans-serif;
      font-size: 5.5rem;
      text-align: center;
      margin-top: 60px;
      user-select: none;
      text-transform: uppercase;
      letter-spacing: 3px;

      /* 1. Путь к твоей гифке огня */
      background-image: url('fire2.gif');

      /* 2. Размножаем гифку плиткой по всему тексту */
      background-repeat: repeat;

      /* 3. Размер одного элемента гифки (регулируй: например 80px, 120px или 200px) */
      background-size: 100px auto; 

      /* 4. Вырезаем гифку ровно по форме букв */
      -webkit-background-clip: text;
      background-clip: text;

      /* 5. Делаем сам текст прозрачным, чтобы был виден только огонь */
      color: transparent;

      /* Отключаем старое свечение, чтобы огонь читал идеально */
      text-shadow: none; 
      animation: none; 
    }

    /* АНИМАЦИЯ ПЛАМЕНИ */
    @keyframes fire {
      0%, 100% {
        text-shadow: 
          0 0 10px #fff,
          0 0 20px #fff,
          0 -5px 25px #ffdc17,
          0 -10px 40px #ff9000,
          0 -15px 55px #ff9000,
          0 -20px 70px #ff3600,
          0 -25px 90px #ff3600;
      }
      20% {
        text-shadow: 
          0 0 10px #fff,
          0 0 20px #fff,
          -1px -7px 27px #ffdc17,
          -2px -12px 42px #ff9000,
          -2px -17px 57px #ff9000,
          -4px -22px 72px #ff3600,
          -4px -27px 92px #ff3600;
      }
      40% {
        text-shadow: 
          0 0 10px #fff,
          0 0 20px #fff,
          1px -6px 30px #ffdc17,
          2px -11px 45px #ff9000,
          3px -16px 60px #ff9000,
          4px -21px 75px #ff3600,
          5px -26px 95px #ff3600;
      }
      60% {
        text-shadow: 
          0 0 10px #fff,
          0 0 20px #fff,
          -2px -8px 32px #ffdc17,
          -3px -13px 48px #ff9000,
          -4px -18px 63px #ff9000,
          -6px -23px 78px #ff3600,
          -7px -28px 98px #ff3600;
      }
      80% {
        text-shadow: 
          0 0 10px #fff,
          0 0 20px #fff,
          2px -5px 28px #ffdc17,
          3px -10px 43px #ff9000,
          4px -15px 58px #ff9000,
          6px -20px 73px #ff3600,
          7px -25px 93px #ff3600;
      }
    }

    /* АУДИОПЛЕЕР */
    .audio-control {
      margin-top: 25px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 12px 28px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .audio-control:hover {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      transform: scale(1.03);
    }

    .audio-control span {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* АДАПТИВ */
    @media (max-width: 768px) {
      .header-title {
        font-size: 3.2rem;
        margin-top: 40px;
        animation-duration: 1s;
      }
      .lyric-line {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Заставка (Intro) -->
  <div id="intro-screen">
    <p class="lyric-line" id="line1">first line of the song...</p>
    <p class="lyric-line" id="line2">second line comes next...</p>
    <div class="click-hint">[ кликни в любом месте ]</div>
  </div>

  <!-- Видео-фон -->
  <video class="video-bg" autoplay loop muted playsinline>
    <source src="bg-video.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- Ник с огненным эффектом -->
  <h1 class="header-title">dreamflasher</h1>

  <!-- Аудиоплеер -->
  <div class="audio-control" id="playBtn">
    <span id="playIcon">❚❚</span>
    <span id="playText">DREAMFLASHER — JANE REMOVER</span>
  </div>

  <audio id="bgMusic" loop>
    <source src="dreamflasher.mp3" type="audio/mpeg">
  </audio>

  <script>
    const introScreen = document.getElementById('intro-screen');
    const music = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');

    // Появление строчек текста
    setTimeout(() => line1.classList.add('active'), 600);
    setTimeout(() => line2.classList.add('active'), 1800);

    // Клик снимает интро и включает автоповтор трека
    introScreen.addEventListener('click', () => {
      music.play();
      introScreen.style.opacity = '0';
      introScreen.style.visibility = 'hidden';
      document.body.style.overflow = 'auto';
    });

    // Кнопка паузы
    let isPlaying = true;
    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        music.play();
        playIcon.textContent = '❚❚';
        isPlaying = true;
      } else {
        music.pause();
        playIcon.textContent = '▶';
        isPlaying = false;
      }
    });
  </script>
</body>
</html>
